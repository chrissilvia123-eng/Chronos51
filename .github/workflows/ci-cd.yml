name: Chronos51 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UE_VERSION: "5.3"
  PROJECT_PATH: "E:/Chronos51/05_UE5_Project/Chronos51/Chronos51.uproject"
  BUILD_CONFIGURATION: "Development"

jobs:
  build:
    name: Build Editor
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup UE5
        uses: peterrdev/setup-unreal-engine@v1
        with:
          version: ${{ env.UE_VERSION }}
          token: ${{ secrets.EPIC_GAMES_TOKEN }}

      - name: Generate Project Files
        run: |
          & "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Build\BatchFiles\Build.bat" Chronos51Editor Win64 Development -Project="${{ env.PROJECT_PATH }}"

      - name: Build Editor
        run: |
          & "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Build\BatchFiles\Build.bat" Chronos51Editor Win64 ${{ env.BUILD_CONFIGURATION }} -Project="${{ env.PROJECT_PATH }}" -WaitMutex

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chronos51-Editor-${{ github.run_id }}
          path: |
            E:/Chronos51/05_UE5_Project/Chronos51/Binaries/Win64/
            E:/Chronos51/05_UE5_Project/Chronos51/Intermediate/Build/
          retention-days: 7

  test:
    name: Automated Tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup UE5
        uses: peterrdev/setup-unreal-engine@v1
        with:
          version: ${{ env.UE_VERSION }}
          token: ${{ secrets.EPIC_GAMES_TOKEN }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Chronos51-Editor-${{ github.run_id }}
          path: E:/Chronos51/05_UE5_Project/Chronos51

      - name: Run Unit Tests
        run: |
          & "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "${{ env.PROJECT_PATH }}" -run=AutomationTest -TestNames="Chronos51.*" -unattended -nullrhi -nosound -log

      - name: Run Gameplay Verification
        run: |
          & "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "${{ env.PROJECT_PATH }}" -game -ExecCmds="Chronos51.VerifyCriticalPath" -unattended -nullrhi -nosound -log

  lint:
    name: Code Linting
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run UnrealHeaderTool Check
        run: |
          & "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Build\BatchFiles\Build.bat" Chronos51Editor Win64 Development -Project="${{ env.PROJECT_PATH }}" -TargetType=Editor -Module=Chronos51 -NoHotReload -ignorejunk

  package:
    name: Package Shipping Build
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup UE5
        uses: peterrdev/setup-unreal-engine@v1
        with:
          version: ${{ env.UE_VERSION }}
          token: ${{ secrets.EPIC_GAMES_TOKEN }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Chronos51-Editor-${{ github.run_id }}
          path: E:/Chronos51/05_UE5_Project/Chronos51

      - name: Package Project (Shipping)
        run: |
          & "C:\Program Files\Epic Games\UE_${{ env.UE_VERSION }}\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="${{ env.PROJECT_PATH }}" -noP4 -platform=Win64 -clientconfig=Shipping -build -cook -map=LVL_EntryHangar -map=LVL_ReactorCore -map=LVL_BioContainment -map=LVL_CommsArray -map=LVL_Hangar18 -map=LVL_Administration -map=LVL_SubLevel0 -unversionedcookedcontent -compressed -pak -prereqs -distribution -archive -archivedirectory=E:/Chronos51/03_Production/04_Builds/Shipping_${{ github.run_number }}

      - name: Upload Shipping Build
        uses: actions/upload-artifact@v4
        with:
          name: Chronos51-Shipping-${{ github.run_number }}
          path: E:/Chronos51/03_Production/04_Builds/Shipping_${{ github.run_number }}/
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: E:/Chronos51/03_Production/04_Builds/Shipping_${{ github.run_number }}/WindowsNoEditor/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on Failure
    if: failure()
    needs: [build, test, lint, package]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Chronos51 CI/CD failed: ${{ github.workflow }} - ${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}